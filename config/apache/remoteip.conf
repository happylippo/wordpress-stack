# Restore the visitor IP forwarded through Cloudflare and Traefik.
# CF-Connecting-IP is supplied by Cloudflare. Trusted proxy addresses are
# generated at container startup from the comma-separated TRUSTED_PROXIES env.
RemoteIPHeader CF-Connecting-IP

# %a is the client IP after mod_remoteip processing.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" realip_combined
CustomLog /proc/self/fd/1 realip_combined
